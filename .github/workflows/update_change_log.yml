name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update changelog
        run: |
          echo "Hi there" >> CHANGELOG.md
          git add .
          git commit -m "Updated changelog."
          git push